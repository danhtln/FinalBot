<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b16" />
      <stop offset="50%" stop-color="#3d2c1d" />
      <stop offset="100%" stop-color="#7c532d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d496" />
      <stop offset="100%" stop-color="#b37a44" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="50" fill="url(#avatarGrad)" />
  <circle cx="50" cy="50" r="44" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6" />
  <!-- Robot Head -->
  <rect x="30" y="34" width="40" height="32" rx="8" fill="#f6f2e9" />
  <!-- Antenna -->
  <line x1="50" y1="24" x2="50" y2="34" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="22" r="4" fill="url(#goldGrad)" />
  <!-- Eyes -->
  <circle cx="42" cy="48" r="4.5" fill="#7c532d" />
  <circle cx="58" cy="48" r="4.5" fill="#7c532d" />
  <circle cx="43.5" cy="46.5" r="1.5" fill="#ffffff" />
  <circle cx="59.5" cy="46.5" r="1.5" fill="#ffffff" />
  <!-- Smile -->
  <path d="M 44 56 Q 50 61 56 56" stroke="#7c532d" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Ear bolts -->
  <rect x="25" y="44" width="5" height="12" rx="2.5" fill="url(#goldGrad)" />
  <rect x="70" y="44" width="5" height="12" rx="2.5" fill="url(#goldGrad)" />
</svg>
